[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolkit"
version = "0.1.0"
description = "Plug-and-play MCP servers for AI agents — search, file ops, shell"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "sunshine", email = "sunshine@studiopig.dev"}
]
keywords = ["mcp", "ai-agent", "agent-tools", "web-search", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/studiopig/mcp-toolkit"
Repository = "https://github.com/studiopig/mcp-toolkit"

[project.scripts]
mcp-toolkit = "mcp_toolkit.cli:main"
